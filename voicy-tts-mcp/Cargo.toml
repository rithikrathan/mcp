[package]
name = "voicy-tts-mcp"
version = "0.1.0"
edition = "2021"
authors = ["Rithik Rathan"]
description = "Fast, lightweight MCP server for Voicy local on-device TTS playback"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
regex = "1.10"
once_cell = "1.19"
libc = "0.2"
