[package]
name = "edge-tts-mcp"
version = "0.1.0"
edition = "2021"
authors = ["Rithik Rathan"]
description = "Fast, lightweight MCP server for Edge TTS audio playback"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
regex = "1.10"
tempfile = "3.10"
